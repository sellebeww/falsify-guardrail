name: Falsify Solidity guardrail
description: Check an existing Solidity contract with trusted functional tests and exploit harnesses.
inputs:
  task:
    description: Path to a trusted task directory containing task.json, tests/, and exploits/.
    required: true
  source:
    description: Path to the contract entry source to evaluate.
    required: true
  source-root:
    description: Optional directory containing the entry source and its Solidity imports.
    default: ''
  solc-version:
    description: Compiler version override. By default it is derived from the task's solc_pragma.
    default: ''
  strict:
    description: Also block unconfirmed detector findings and tasks without an exploitable control.
    default: 'false'
  artifact:
    description: Output JSON path relative to the caller workspace.
    default: results/falsify.json
  sarif:
    description: Optional SARIF output path, for github/codeql-action/upload-sarif.
    default: ''
  job-summary:
    description: Append a Markdown result table to the job summary.
    default: 'true'
outputs:
  artifact:
    description: JSON evaluation artifact path.
    value: ${{ inputs.artifact }}
  sarif:
    description: SARIF path, if requested.
    value: ${{ inputs.sarif }}
runs:
  using: composite
  steps:
    # Third-party actions are pinned to commit SHAs; comments name the release.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'
    - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09  # v1.9.1
      with:
        version: v1.8.3
    - name: Install Falsify and compiler
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TASK_PATH: ${{ inputs.task }}
        SOLC_OVERRIDE: ${{ inputs.solc-version }}
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/falsify-venv"
        "$RUNNER_TEMP/falsify-venv/bin/pip" install "$ACTION_PATH[analysis]"
        solc_pin="$SOLC_OVERRIDE"
        if [[ -z "$solc_pin" ]]; then
          solc_pin="$("$RUNNER_TEMP/falsify-venv/bin/python" -c 'import sys; from falsify import benchmark, toolpaths; print(toolpaths.solc_pin(benchmark.task_meta(sys.argv[1]).get("solc_pragma", "")))' "$TASK_PATH")"
        fi
        if [[ ! "$solc_pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::invalid solc version: $solc_pin"; exit 1
        fi
        "$RUNNER_TEMP/falsify-venv/bin/solc-select" install "$solc_pin"
        echo "$RUNNER_TEMP/falsify-venv/bin" >> "$GITHUB_PATH"
    - name: Evaluate supplied source
      shell: bash
      env:
        TASK_PATH: ${{ inputs.task }}
        SOURCE_PATH: ${{ inputs.source }}
        SOURCE_ROOT: ${{ inputs.source-root }}
        ARTIFACT_PATH: ${{ inputs.artifact }}
        SARIF_PATH: ${{ inputs.sarif }}
        STRICT: ${{ inputs.strict }}
        JOB_SUMMARY: ${{ inputs.job-summary }}
      run: |
        set -euo pipefail
        args=(check --task "$TASK_PATH" --source "$SOURCE_PATH" --out "$ARTIFACT_PATH")
        if [[ -n "$SOURCE_ROOT" ]]; then args+=(--source-root "$SOURCE_ROOT"); fi
        if [[ -n "$SARIF_PATH" ]]; then args+=(--sarif "$SARIF_PATH"); fi
        if [[ "$STRICT" == "true" ]]; then args+=(--strict); fi
        if [[ "$JOB_SUMMARY" == "true" ]]; then args+=(--summary "$GITHUB_STEP_SUMMARY"); fi
        falsify "${args[@]}"
